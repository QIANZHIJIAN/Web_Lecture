<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 16px;
        }
        .parent {
            width: 600px;
            font-size: 20px;
            border: 2px solid black;
            margin-bottom: 20px;
        }
        .px-box {
            width: 300px;
            background-color: lightblue;
        }
        .percent-box {
            width: 50%;
            background-color: lightgreen;
        }
        .em-text {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>CSS 크기 단위 예제</h1>
    
    <div class="parent">
        부모 영역: width 600px
        <div class="px-box">
            width: 300px
        </div>
        <div class="percent-box">
            width: 50%
        </div>
        <p class="em-text">
            font-size: 2em
        </p >
    </div>
</body>
</html>
