<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child {
            color: red;
        }

        li:last-child {
        color: blue;
        }

        li:nth-child(3) {
            color: green;
        }

        li:nth-last-child(2) {
            color: purple;
        }
    </style>
</head>
<body>
    <ul>
        <li>1번 항목</li>
        <li>2번 항목</li>
        <li>3번 항목</li>
        <li>4번 항목</li>
        <li>5번 항목</li>
    </ul>
</body>
</html>
